services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cs2_prediction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    depends_on:
      - db
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cs2_prediction
      JWT_SECRET: change-this-in-production
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
