services:
  - type: web
    name: cs2-prediction-center
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cs2-prediction-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: PANDASCORE_TOKEN
        sync: false

databases:
  - name: cs2-prediction-db
    plan: free
